syntax = "proto3";

package dynamic_trace;

enum MemorySpaceType {
  MEM_SPACE_STANDARD = 0;
  MEM_SPACE_SHARED = 1;
  MEM_SPACE_DSMEM = 2;     // Distributed shared memory (remote CTA within cluster)
  MEM_SPACE_CONSTANT = 3;
  MEM_SPACE_CALL_RET = 4;
}

message address {
  int32 data_width = 1;
  uint32 udesc_value = 2;
  int32 compression_format = 3;
  uint64 base_address = 4;
  int32 stride = 5;
  repeated int64 addrs = 6;
  MemorySpaceType memory_space = 7;
}